<svg xmlns="http://www.w3.org/2000/svg" width="274" height="40" viewBox="0 0 274 40" role="img" aria-label="Scheduled maintenance in progress" direction="ltr" font-family="Noto Sans,Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif" data-state="maintenance" data-variant="compact" data-theme="light" data-palette="inbrief" data-pulse="on">
<title>Scheduled maintenance in progress</title>
<style>
.ib-surface{fill:#FFFFFF}
.ib-foreground{fill:#18221F}
.ib-muted{fill:#65716D}
.ib-muted-stroke{stroke:#DBE4E0}
.ib-accent{fill:#2a5f8f}
.ib-accent-stroke{stroke:#2a5f8f}
.ib-outline{stroke:#2a5f8f;stroke-opacity:.62}
.ib-pulse-ring{animation:ib-pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ib-pulse{0%{opacity:.32;transform:scale(.72)}70%,100%{opacity:0;transform:scale(1.28)}}
@media (prefers-reduced-motion: reduce){.ib-pulse-ring{animation:none;opacity:.16;transform:none}}
</style>
<rect class="ib-surface ib-outline" x="0.75" y="0.75" width="272.5" height="38.5" rx="12" stroke-width="1.5"/>
<g aria-hidden="true">
<circle class="ib-accent ib-pulse-ring" cx="22" cy="20" r="9" opacity=".28"/>
<circle class="ib-accent" cx="22" cy="20" r="9" opacity=".12"/>
<circle class="ib-accent-stroke" cx="22" cy="20" r="8.5" fill="none" stroke-width="1" opacity=".28"/>
<circle class="ib-accent-stroke" cx="22" cy="20" r="5" fill="none" stroke-width="2"/>
<path class="ib-accent-stroke" d="M 22 17 V 20 L 25 22" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text class="ib-accent" x="151.5" y="25" font-size="14" font-weight="500" text-anchor="middle" direction="ltr" unicode-bidi="plaintext">Scheduled maintenance in progress</text>
</svg>