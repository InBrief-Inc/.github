<svg xmlns="http://www.w3.org/2000/svg" width="191" height="40" viewBox="0 0 191 40" role="img" aria-label="Everything is working" direction="ltr" font-family="Noto Sans,Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif" data-state="operational" data-variant="compact" data-theme="dark" data-palette="inbrief" data-pulse="on">
